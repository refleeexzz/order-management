# Order Management System - CI Pipeline
# Runs on every push and pull request to main/develop branches

name: CI Pipeline

on:
  push:
    branches: [main, develop, master]
  pull_request:
    branches: [main, develop, master]

env:
  GO_VERSION: '1.23'
  NODE_VERSION: '20'

jobs:
  # ============================================
  # Backend Jobs
  # ============================================
  backend-build:
    name: Backend - Build, Vet & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Create database
        run: psql -h localhost -p 5433 -U postgres -c "CREATE DATABASE order_management;"

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Run tests
        run: go test ./...
        env:
          DB_HOST: localhost
          DB_PORT: 5433
          DB_NAME: order_management
          DB_USER: postgres
          DB_PASSWORD: postgres

  # ============================================
  # Frontend Jobs
  # ============================================
  frontend-build:
    name: Frontend - Build & Lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build application
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  frontend-type-check:
    name: Frontend - Type Check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

  # ============================================
  # Docker Build Jobs
  # ============================================
  docker-build:
    name: Docker - Build Images
    runs-on: ubuntu-latest
    needs: [backend-build, frontend-build]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: order-management-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: order-management-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================
  # Integration Test
  # ============================================
  integration-test:
    name: Integration - Docker Compose
    runs-on: ubuntu-latest
    needs: docker-build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and start services
        run: docker compose up -d --build

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for services to start..."
          sleep 60

          # Check backend health
          for i in {1..30}; do
            if curl -s http://localhost:8080/actuator/health | grep -q "UP"; then
              echo "Backend is healthy!"
              break
            fi
            echo "Waiting for backend... attempt $i"
            sleep 10
          done

          # Check frontend health
          for i in {1..10}; do
            if curl -s http://localhost:3000/health | grep -q "healthy"; then
              echo "Frontend is healthy!"
              break
            fi
            echo "Waiting for frontend... attempt $i"
            sleep 5
          done

      - name: Test API endpoints
        run: |
          echo "Testing API endpoints..."
          curl -f http://localhost:8080/actuator/health || exit 1
          echo "API health check passed!"

      - name: Test Frontend
        run: |
          echo "Testing Frontend..."
          curl -f http://localhost:3000/ || exit 1
          echo "Frontend check passed!"

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop services
        if: always()
        run: docker compose down -v

  # ============================================
  # Summary Job
  # ============================================
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [backend-build, frontend-build, docker-build, integration-test]
    if: success()

    steps:
      - name: CI Pipeline completed successfully
        run: |
          echo "✅ All CI checks passed!"
          echo "Backend build: ✅"
          echo "Frontend build: ✅"
          echo "Docker build: ✅"
          echo "Integration tests: ✅"
